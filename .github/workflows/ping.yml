name: Uptime check

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub's minimum practical interval; can drift a few min under load
  workflow_dispatch: {}       # lets you trigger a manual test run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check sites, alert on Telegram if any are down
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          SITES="https://3x3.team http://31.28.5.203"
          for url in $SITES; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
            echo "$url -> $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              text="⚠️ $url отвечает $code (или не отвечает вовсе) — $(date -u +'%Y-%m-%d %H:%M UTC')"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="$text"
            fi
          done
